[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This is a deployed application, not a distributable library. Disabling
# package auto-discovery keeps `pip install -e .` working purely as a way to
# resolve dependencies from a single source of truth, without setuptools
# trying to guess which of config/ core/ modules/ is "the package".
[tool.setuptools]
py-modules = []

[project]
name = "fusion-integrated"
version = "0.1.0"
description = "Fusion-Integrated — the non-academic platform. Independent modules, one login."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "requests>=2.32",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    # Recruiter passwords. These are the only credentials this service stores —
    # institute users authenticate at the IAM and we never see their password.
    # Recruiters are external parties, so their hashes get the strongest
    # available KDF rather than Django's PBKDF2 default.
    "argon2-cffi>=23.1",
    # The WSGI server ops/systemd/fusion-platform.service runs. Nothing else
    # can serve this in production.
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.6",
    "import-linter>=2.0",
    "responses>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*", ".venv", "build", "dist"]

[tool.ruff.lint]
# Wide net; everything switched off below has a stated reason.
select = [
  "F", "E", "W", "I", "N", "UP", "B", "C4", "S", "BLE", "A", "DJ",
  "ISC", "PIE", "T20", "RET", "SIM", "TC", "PERF", "RUF", "TRY",
  "PLC", "PLE", "PLW", "EXE", "G", "INT", "YTT", "ASYNC",
]
ignore = [
  "S101",      # assert is fine in tests
  "TRY003",    # domain errors carry a sentence written for whoever reads it
  "TRY400",    # a handled IAM blip is a warning, not an exception
  "RUF012",    # DRF class attributes are mutable by design
  "PLC0415",   # function-level imports break real cycles and keep domain/ clean
  "ISC001",    # conflicts with the formatter
  "T201",      # ops/checks are CLI scripts; printing is their output
  "PLW2901",   # rebinding a loop variable is idiomatic in the parsers here
  "N818",      # *Error is rendered by HTTP; a bare name is a domain signal
  "TC001", "TC002", "TC003",   # Django imports the app tree at boot anyway
]

[tool.ruff.lint.per-file-ignores]
# `Decimal as D` keeps a table of money literals readable.
"*/tests/*" = ["S", "E501", "N817"]
"config/settings/*" = ["F403", "F405"]
# A PDF-prose generator; long strings and typographic dashes are its content, not a style defect.
"docs/08-delivery/build_assignment_pdf.py" = ["E501", "RUF001", "ISC004"]

[tool.pytest.ini_options]
# `--ds` rather than DJANGO_SETTINGS_MODULE: pytest-django lets the
# environment variable win over this file, and a developer exporting
# config.settings.dev would then run a different suite from CI.
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --no-header --ds=config.settings.test"
testpaths = ["modules", "core", "fusion_auth"]
