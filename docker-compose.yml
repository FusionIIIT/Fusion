version: "3.9"
services:
  db:
    image: postgres:13-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=fusionlab
      - POSTGRES_USER=fusion_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hello123}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion_admin -d fusionlab"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .:/home/app
    ports:
      - 8000:8000
    command: bash docker-entrypoint.sh
    environment:
      - DB_HOST=db
      - DB_NAME=fusionlab
      - DB_USER=fusion_admin
      - DB_PASSWORD=${DB_PASSWORD:-hello123}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../Fusion-client
      dockerfile: Dockerfile.dev
    restart: always
    volumes:
      - ../Fusion-client:/app
      - /app/node_modules
    ports:
      - 5173:5173
    depends_on:
      - app
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  postgres_data:

