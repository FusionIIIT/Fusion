<!doctype html>
{# Rendered by Django's error handlers. Self-contained on purpose: no static files and no URL lookups, which can fail and turn an error page into a crash. #}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Page not found | Fusion</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; color: #1f2933; }
    main { text-align: center; padding: 2rem 1rem; max-width: 32rem; }
    .code { font-size: 4rem; font-weight: 700; color: #15abff; margin: 0; }
    h1 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
    p { line-height: 1.5; color: #52606d; }
    a { color: #1971c2; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you asked for does not exist or has moved.</p>
    <p><a href="/">Go to Fusion</a></p>
  </main>
</body>
</html>
