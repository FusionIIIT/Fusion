business_rules:
  - id: "BR-001"
    title: "Authorization"
    description: "Users must be authenticated; Access is restricted by role/designation."

    valid_tests:
      - input_action: "Perform action that should satisfy BR-001"
        expected_result: "System accepts valid input and preserves expected state transitions."

    invalid_tests:
      - input_action: "Perform action that should violate BR-001"
        expected_result: "System rejects invalid input with explicit validation/authorization error and no invalid state change."
