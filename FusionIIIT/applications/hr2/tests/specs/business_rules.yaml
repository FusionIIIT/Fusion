business_rules:
  - id: "BR-HR2-001"
    title: "Leave start date cannot be in the past"
    description: "Leave application start date must be today or later"
    valid_tests:
      - input_action: "Apply leave with start_date=tomorrow"
        expected_result: "Request accepted"
    invalid_tests:
      - input_action: "Apply leave with start_date=yesterday"
        expected_result: "Request rejected with start_date validation error"

  - id: "BR-HR2-002"
    title: "Leave end date must be on/after start date"
    description: "End date must be greater than or equal to start date"
    valid_tests:
      - input_action: "Apply leave with start_date=2026-05-01, end_date=2026-05-03"
        expected_result: "Request accepted"
    invalid_tests:
      - input_action: "Apply leave with start_date=2026-05-03, end_date=2026-05-01"
        expected_result: "Request rejected with date range error"

  - id: "BR-HR2-003"
    title: "Total days must match date range"
    description: "total_days must equal (end_date - start_date + 1)"
    valid_tests:
      - input_action: "Apply leave with start_date=2026-05-01, end_date=2026-05-03, total_days=3"
        expected_result: "Request accepted"
    invalid_tests:
      - input_action: "Apply leave with start_date=2026-05-01, end_date=2026-05-03, total_days=2"
        expected_result: "Request rejected with total_days mismatch error"

  - id: "BR-HR2-004"
    title: "Leave requests cannot overlap"
    description: "Employee cannot have overlapping pending/forwarded/approved leave"
    valid_tests:
      - input_action: "Apply leave for 2026-05-10 to 2026-05-12 when no overlaps"
        expected_result: "Request accepted"
    invalid_tests:
      - input_action: "Apply leave overlapping existing approved leave"
        expected_result: "Request rejected with overlap error"

  - id: "BR-HR2-005"
    title: "Leave balance must be sufficient"
    description: "Requested days must be <= current leave balance"
    valid_tests:
      - input_action: "Apply leave for 2 days with balance >= 2"
        expected_result: "Request accepted"
    invalid_tests:
      - input_action: "Apply leave for 10 days with balance < 10"
        expected_result: "Request rejected with insufficient balance error"

  - id: "BR-HR2-006"
    title: "Nominee employee must exist"
    description: "Nominee ID must match an existing employee"
    valid_tests:
      - input_action: "Apply leave with nominee_employee_id=valid"
        expected_result: "Request accepted with nominee_status=PENDING"
    invalid_tests:
      - input_action: "Apply leave with nominee_employee_id=invalid"
        expected_result: "Request rejected with nominee not found error"

  - id: "BR-HR2-007"
    title: "Only owner can withdraw leave"
    description: "Employee can withdraw own pending/forwarded leave"
    valid_tests:
      - input_action: "Owner withdraws pending leave"
        expected_result: "Leave updated to WITHDRAWN"
    invalid_tests:
      - input_action: "Non-owner withdraws leave"
        expected_result: "Request rejected with 403"

  - id: "BR-HR2-008"
    title: "Cancellation only before start date"
    description: "Cancellation request allowed only up to 1 day before start"
    valid_tests:
      - input_action: "Request cancellation one day before start"
        expected_result: "Cancellation request accepted"
    invalid_tests:
      - input_action: "Request cancellation on start date"
        expected_result: "Request rejected with cancellation window error"

  - id: "BR-HR2-009"
    title: "Leave delete only when pending"
    description: "Only pending leave applications can be deleted"
    valid_tests:
      - input_action: "Delete pending leave"
        expected_result: "Leave deleted"
    invalid_tests:
      - input_action: "Delete approved leave"
        expected_result: "Request rejected with delete error"

  - id: "BR-HR2-010"
    title: "Cancellation requires approved leave and no prior request"
    description: "Cancel request allowed only for approved leave with cancel_status=NOT_REQUESTED"
    valid_tests:
      - input_action: "Request cancellation for approved leave"
        expected_result: "Cancel status set to REQUESTED"
    invalid_tests:
      - input_action: "Request cancellation for pending leave"
        expected_result: "Request rejected with approval_status error"
      - input_action: "Request cancellation when cancel_status already REQUESTED"
        expected_result: "Request rejected as already processed"

  - id: "BR-HR2-011"
    title: "Extension requires approved leave before end date"
    description: "Extension request allowed only before end_date and with new_end_date after current end"
    valid_tests:
      - input_action: "Request extension with new_end_date after current end date"
        expected_result: "Extension status set to REQUESTED"
    invalid_tests:
      - input_action: "Request extension after end_date"
        expected_result: "Request rejected with extension window error"
      - input_action: "Request extension with new_end_date before current end date"
        expected_result: "Request rejected with date validation error"

  - id: "BR-HR2-012"
    title: "Extension approval needs balance"
    description: "Extension approval must have enough remaining leave balance"
    valid_tests:
      - input_action: "Approve extension with sufficient balance"
        expected_result: "Extension approved and balance reduced"
    invalid_tests:
      - input_action: "Approve extension with insufficient balance"
        expected_result: "Request rejected with insufficient balance error"

  - id: "BR-HR2-013"
    title: "Document request requires HOD role"
    description: "Only HOD can request documents with non-empty message"
    valid_tests:
      - input_action: "HOD requests document with message"
        expected_result: "Document request status set to REQUESTED"
    invalid_tests:
      - input_action: "Non-HOD requests document"
        expected_result: "Request rejected with 403"
      - input_action: "HOD requests document without message"
        expected_result: "Request rejected with message required"

  - id: "BR-HR2-014"
    title: "Document submit requires owner and request"
    description: "Only leave owner can submit document after it was requested"
    valid_tests:
      - input_action: "Owner submits document after request"
        expected_result: "Document request status set to SUBMITTED"
    invalid_tests:
      - input_action: "Owner submits document without request"
        expected_result: "Request rejected with no request error"
      - input_action: "Non-owner submits document"
        expected_result: "Request rejected with 403"

  - id: "BR-HR2-015"
    title: "Nominee decision only by nominee"
    description: "Only the nominated employee can accept or decline"
    valid_tests:
      - input_action: "Nominee accepts request"
        expected_result: "Nominee status updated to ACCEPTED"
    invalid_tests:
      - input_action: "Non-nominee responds"
        expected_result: "Request rejected with 403"
      - input_action: "Nominee sends invalid action"
        expected_result: "Request rejected with invalid action"

  - id: "BR-HR2-016"
    title: "Leave decision action must be valid"
    description: "Decision must be approve, reject, or forward"
    valid_tests:
      - input_action: "Approve leave via decision endpoint"
        expected_result: "Leave status updated to APPROVED"
    invalid_tests:
      - input_action: "Decision action=invalid"
        expected_result: "Request rejected with invalid decision"

  - id: "BR-HR2-017"
    title: "Leave balance record must exist"
    description: "Leave type balance must exist for employee"
    valid_tests:
      - input_action: "Apply leave with existing leave balance"
        expected_result: "Request accepted"
    invalid_tests:
      - input_action: "Apply leave with no balance record for type"
        expected_result: "Request rejected with balance not found error"

  - id: "BR-HR2-018"
    title: "Leave application requires employee profile"
    description: "Employee profile must be resolved from user or employee_id"
    valid_tests:
      - input_action: "Apply leave as authenticated employee"
        expected_result: "Request accepted"
    invalid_tests:
      - input_action: "Apply leave without employee profile and no employee_id"
        expected_result: "Request rejected with employee profile not found"

  - id: "BR-HR2-019"
    title: "LTC withdrawal only when pending"
    description: "Only pending LTC requests can be withdrawn by owner"
    valid_tests:
      - input_action: "Owner withdraws pending LTC"
        expected_result: "LTC updated to WITHDRAWN"
    invalid_tests:
      - input_action: "Owner withdraws approved LTC"
        expected_result: "Request rejected with pending-only error"

  - id: "BR-HR2-020"
    title: "LTC decision action must be valid"
    description: "Decision must be approve, reject, or forward"
    valid_tests:
      - input_action: "Forward LTC"
        expected_result: "Approval status set to FORWARDED and accountant_status=PENDING"
    invalid_tests:
      - input_action: "Decision action=invalid"
        expected_result: "Request rejected with invalid decision"

  - id: "BR-HR2-021"
    title: "CPDA advance withdrawal only when pending"
    description: "Only pending CPDA advance requests can be withdrawn by owner"
    valid_tests:
      - input_action: "Owner withdraws pending CPDA advance"
        expected_result: "CPDA updated to WITHDRAWN"
    invalid_tests:
      - input_action: "Owner withdraws approved CPDA advance"
        expected_result: "Request rejected with pending-only error"

  - id: "BR-HR2-022"
    title: "CPDA advance decision action must be valid"
    description: "Decision must be approve, reject, forward-accountant, or forward-director"
    valid_tests:
      - input_action: "Forward CPDA advance to accountant"
        expected_result: "Status FORWARDED and accountant_processing_status=PENDING"
      - input_action: "Forward CPDA advance to director"
        expected_result: "Status FORWARDED and accountant_processing_status=DIRECTOR_REVIEW"
    invalid_tests:
      - input_action: "Decision action=invalid"
        expected_result: "Request rejected with invalid decision"

  - id: "BR-HR2-023"
    title: "Download access restricted to owner or staff"
    description: "Leave/LTC/CPDA/Appraisal downloads require ownership or staff access"
    valid_tests:
      - input_action: "Owner downloads own leave application"
        expected_result: "Download succeeds"
    invalid_tests:
      - input_action: "Non-owner downloads another employee record"
        expected_result: "Request rejected with 403"

  - id: "BR-HR2-024"
    title: "Appraisal review sets status"
    description: "Review action sets status to REVIEWED or APPROVED"
    valid_tests:
      - input_action: "Reviewer forwards appraisal"
        expected_result: "Appraisal status set to REVIEWED"
      - input_action: "Reviewer approves appraisal"
        expected_result: "Appraisal status set to APPROVED"
