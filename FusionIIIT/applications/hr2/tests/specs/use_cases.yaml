use_cases:
  - id: "UC-HR2-001"
    title: "List employees"
    description: "HR staff or authorized users retrieve employees filtered by type or department"
    actors: "HR staff, HOD, Employee"
    preconditions: "Authenticated user with access to HR2 module"
    happy_paths:
      - scenario: "HR staff lists all employees"
        preconditions: "User has HR designation or is HR staff"
        input_action: "GET /hr2/api/employees/"
        expected_result: "Returns list of employees"
      - scenario: "Filter employees by type and department"
        preconditions: "User is authenticated"
        input_action: "GET /hr2/api/employees/?type=Faculty&department=1"
        expected_result: "Returns employees matching filters"
    alternate_paths:
      - scenario: "Request with only department filter"
        preconditions: "User is authenticated"
        input_action: "GET /hr2/api/employees/?department=1"
        expected_result: "Returns employees in department"
    exception_paths:
      - scenario: "Unauthorized user tries to list employees"
        preconditions: "User is not authenticated"
        input_action: "GET /hr2/api/employees/"
        expected_result: "Returns 401 Unauthorized"

  - id: "UC-HR2-002"
    title: "View employee details"
    description: "Fetch a specific employee profile"
    actors: "HR staff, HOD, Employee"
    preconditions: "Authenticated user with access to HR2 module"
    happy_paths:
      - scenario: "Fetch employee details by ID"
        preconditions: "Employee exists"
        input_action: "GET /hr2/api/employees/123/"
        expected_result: "Returns employee details"
    alternate_paths:
      - scenario: "HOD fetches employee details"
        preconditions: "HOD is authenticated"
        input_action: "GET /hr2/api/employees/123/"
        expected_result: "Returns employee details"
    exception_paths:
      - scenario: "Employee not found"
        preconditions: "Employee does not exist"
        input_action: "GET /hr2/api/employees/999999/"
        expected_result: "Returns 404 Not Found"

  - id: "UC-HR2-003"
    title: "Update employee details"
    description: "Update employee profile information"
    actors: "HR staff"
    preconditions: "Authenticated HR staff"
    happy_paths:
      - scenario: "Update phone number"
        preconditions: "Employee exists"
        input_action: "PUT /hr2/api/employees/123/ with phone_number=9876543210"
        expected_result: "Returns updated employee details"
    alternate_paths:
      - scenario: "Update employee address"
        preconditions: "Employee exists"
        input_action: "PUT /hr2/api/employees/123/ with address=Updated"
        expected_result: "Returns updated employee details"
    exception_paths:
      - scenario: "Invalid data"
        preconditions: "Employee exists"
        input_action: "PUT /hr2/api/employees/123/ with phone_number=invalid"
        expected_result: "Returns 400 validation error"

  - id: "UC-HR2-004"
    title: "Apply for leave"
    description: "Employee submits a leave application"
    actors: "Employee"
    preconditions: "Authenticated employee with available leave balance"
    happy_paths:
      - scenario: "Apply for casual leave with valid dates"
        preconditions: "Leave balance is sufficient"
        input_action: "POST /hr2/api/leave-applications/ with leave_type=CL, start_date=future, end_date=future+2, total_days=3"
        expected_result: "Leave application created with approval_status=PENDING or FORWARDED"
    alternate_paths:
      - scenario: "Nominate substitute during leave"
        preconditions: "Nominee employee exists"
        input_action: "POST /hr2/api/leave-applications/ with nominee_employee_id=456"
        expected_result: "Leave created with nominee_status=PENDING"
    exception_paths:
      - scenario: "Start date in the past"
        preconditions: "Employee is authenticated"
        input_action: "POST /hr2/api/leave-applications/ with start_date=yesterday"
        expected_result: "Returns 400 start_date validation error"

  - id: "UC-HR2-005"
    title: "View leave applications"
    description: "Fetch leave applications based on user role"
    actors: "Employee, HOD, Registrar, Director, HR staff"
    preconditions: "Authenticated user"
    happy_paths:
      - scenario: "Employee views own leave applications"
        preconditions: "Employee is authenticated"
        input_action: "GET /hr2/api/leave-applications/"
        expected_result: "Returns only employee's leave applications"
      - scenario: "Director views forwarded applications"
        preconditions: "User has Director designation"
        input_action: "GET /hr2/api/leave-applications/"
        expected_result: "Returns forwarded and requested decisions"
    alternate_paths:
      - scenario: "HOD views departmental leave applications"
        preconditions: "User has HOD designation"
        input_action: "GET /hr2/api/leave-applications/"
        expected_result: "Returns department leave applications"
    exception_paths:
      - scenario: "Unauthorized user tries to list leave applications"
        preconditions: "User is not authenticated"
        input_action: "GET /hr2/api/leave-applications/"
        expected_result: "Returns 401 Unauthorized"

  - id: "UC-HR2-006"
    title: "Withdraw leave application"
    description: "Employee or approver withdraws a pending or forwarded leave"
    actors: "Employee, Registrar, HR admin, Accountant"
    preconditions: "Authenticated user with appropriate role"
    happy_paths:
      - scenario: "Employee withdraws own pending leave"
        preconditions: "Leave approval_status is PENDING"
        input_action: "POST /hr2/api/leave-applications/10/withdraw/"
        expected_result: "Leave updated to approval_status=WITHDRAWN"
    alternate_paths:
      - scenario: "Registrar withdraws forwarded leave"
        preconditions: "Leave approval_status is FORWARDED"
        input_action: "POST /hr2/api/leave-applications/10/withdraw/"
        expected_result: "Leave updated to approval_status=REJECTED"
    exception_paths:
      - scenario: "Withdraw non-pending leave"
        preconditions: "Leave approval_status is APPROVED"
        input_action: "POST /hr2/api/leave-applications/10/withdraw/"
        expected_result: "Returns 400 with withdrawal error"

  - id: "UC-HR2-007"
    title: "Request leave cancellation"
    description: "Employee requests cancellation of an approved leave"
    actors: "Employee"
    preconditions: "Authenticated employee with approved leave"
    happy_paths:
      - scenario: "Submit cancellation request before start date"
        preconditions: "Today is before leave start date"
        input_action: "POST /hr2/api/leave-applications/10/cancel-request/ with reason=change of plan"
        expected_result: "Cancel status set to REQUESTED"
    alternate_paths:
      - scenario: "Submit cancellation request with reason"
        preconditions: "Approved leave exists"
        input_action: "POST /hr2/api/leave-applications/10/cancel-request/ with reason=medical"
        expected_result: "Cancel status set to REQUESTED"
    exception_paths:
      - scenario: "Cancellation after start date"
        preconditions: "Today is on or after start date"
        input_action: "POST /hr2/api/leave-applications/10/cancel-request/"
        expected_result: "Returns 400 cancellation window error"

  - id: "UC-HR2-008"
    title: "Request leave extension"
    description: "Employee requests extension of an approved leave"
    actors: "Employee"
    preconditions: "Authenticated employee with approved leave"
    happy_paths:
      - scenario: "Request extension with new end date"
        preconditions: "Extension dates are valid"
        input_action: "POST /hr2/api/leave-applications/10/extension-request/ with new_end_date=future+2"
        expected_result: "Extension status set to REQUESTED"
    alternate_paths:
      - scenario: "Request extension with reason"
        preconditions: "Extension dates are valid"
        input_action: "POST /hr2/api/leave-applications/10/extension-request/ with reason=medical"
        expected_result: "Extension status set to REQUESTED"
    exception_paths:
      - scenario: "Extension with invalid date"
        preconditions: "New end date before current end date"
        input_action: "POST /hr2/api/leave-applications/10/extension-request/ with new_end_date=earlier"
        expected_result: "Returns 400 validation error"

  - id: "UC-HR2-009"
    title: "View leave balance"
    description: "Employee or HR staff checks leave balance"
    actors: "Employee, HR staff"
    preconditions: "Authenticated user"
    happy_paths:
      - scenario: "Employee views own leave balance"
        preconditions: "Employee is authenticated"
        input_action: "GET /hr2/api/leave-balance/"
        expected_result: "Returns leave balance for the employee"
      - scenario: "HR views leave balance for another employee"
        preconditions: "User has HR designation"
        input_action: "GET /hr2/api/leave-balance/123/"
        expected_result: "Returns leave balance for employee 123"
    alternate_paths:
      - scenario: "Employee views balance with no records"
        preconditions: "Employee has no balance entries"
        input_action: "GET /hr2/api/leave-balance/"
        expected_result: "Returns empty balance list"
    exception_paths:
      - scenario: "Unauthorized user tries to view leave balance"
        preconditions: "User is not authenticated"
        input_action: "GET /hr2/api/leave-balance/"
        expected_result: "Returns 401 Unauthorized"

  - id: "UC-HR2-010"
    title: "Download leave application"
    description: "Employee downloads a leave application summary"
    actors: "Employee"
    preconditions: "Authenticated employee who owns the leave application"
    happy_paths:
      - scenario: "Download approved leave application"
        preconditions: "Leave exists and belongs to employee"
        input_action: "GET /hr2/api/leave-applications/10/download/"
        expected_result: "Returns text file attachment with leave details"
    alternate_paths:
      - scenario: "Download pending leave application"
        preconditions: "Leave is pending and belongs to employee"
        input_action: "GET /hr2/api/leave-applications/10/download/"
        expected_result: "Returns text file attachment with leave details"
    exception_paths:
      - scenario: "Access another employee's leave"
        preconditions: "Leave does not belong to requester"
        input_action: "GET /hr2/api/leave-applications/999/download/"
        expected_result: "Returns 403 Not authorized"

  - id: "UC-HR2-011"
    title: "Submit LTC application"
    description: "Employee submits LTC claim"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "Submit LTC claim"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/ltc/ with required LTC fields"
        expected_result: "LTC application created with approval_status=PENDING"
    alternate_paths:
      - scenario: "Submit LTC claim with optional fields"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/ltc/ with optional fields"
        expected_result: "LTC application created with approval_status=PENDING"
    exception_paths:
      - scenario: "Missing required fields"
        preconditions: "Employee is authenticated"
        input_action: "POST /hr2/api/ltc/ with incomplete payload"
        expected_result: "Returns 400 validation errors"

  - id: "UC-HR2-012"
    title: "Submit CPDA advance"
    description: "Employee submits CPDA advance request"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "Submit CPDA advance"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/cpda-advances/ with required fields"
        expected_result: "CPDA advance created with approval_status=PENDING"
    alternate_paths:
      - scenario: "Submit CPDA advance with optional expenses"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/cpda-advances/ with optional fields"
        expected_result: "CPDA advance created with approval_status=PENDING"
    exception_paths:
      - scenario: "Invalid amount"
        preconditions: "Employee is authenticated"
        input_action: "POST /hr2/api/cpda-advances/ with amountRequired=invalid"
        expected_result: "Returns 400 validation errors"

  - id: "UC-HR2-013"
    title: "Submit appraisal form"
    description: "Employee submits appraisal form for review"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "Submit appraisal form"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/appraisal-forms/ with required fields"
        expected_result: "Appraisal form created with status=SUBMITTED"
    alternate_paths:
      - scenario: "Submit appraisal form with optional fields"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/appraisal-forms/ with optional fields"
        expected_result: "Appraisal form created with status=SUBMITTED"
    exception_paths:
      - scenario: "Missing required fields"
        preconditions: "Employee is authenticated"
        input_action: "POST /hr2/api/appraisal-forms/ with incomplete payload"
        expected_result: "Returns 400 validation errors"

  - id: "UC-HR2-014"
    title: "View leave application details"
    description: "Fetch a specific leave application"
    actors: "Employee, HR staff"
    preconditions: "Authenticated user"
    happy_paths:
      - scenario: "Fetch leave application by ID"
        preconditions: "Leave application exists"
        input_action: "GET /hr2/api/leave-applications/10/"
        expected_result: "Returns leave application"
    alternate_paths:
      - scenario: "HR staff fetches leave application by ID"
        preconditions: "HR staff is authenticated"
        input_action: "GET /hr2/api/leave-applications/10/"
        expected_result: "Returns leave application"
    exception_paths:
      - scenario: "Leave application not found"
        preconditions: "Leave application does not exist"
        input_action: "GET /hr2/api/leave-applications/999/"
        expected_result: "Returns 404 Not Found"

  - id: "UC-HR2-015"
    title: "Update leave application"
    description: "Employee updates a leave application"
    actors: "Employee"
    preconditions: "Authenticated employee who owns the leave"
    happy_paths:
      - scenario: "Update leave reason"
        preconditions: "Leave belongs to employee"
        input_action: "PUT /hr2/api/leave-applications/10/ with reason=updated"
        expected_result: "Leave application updated"
    alternate_paths:
      - scenario: "Update leave handover notes"
        preconditions: "Leave belongs to employee"
        input_action: "PUT /hr2/api/leave-applications/10/ with handover_notes=updated"
        expected_result: "Leave application updated"
    exception_paths:
      - scenario: "Update another employee's leave"
        preconditions: "Leave belongs to another employee"
        input_action: "PUT /hr2/api/leave-applications/10/"
        expected_result: "Returns 403 Not authorized"

  - id: "UC-HR2-016"
    title: "Delete leave application"
    description: "Employee deletes a pending leave application"
    actors: "Employee"
    preconditions: "Authenticated employee who owns the leave"
    happy_paths:
      - scenario: "Delete pending leave"
        preconditions: "Leave approval_status is PENDING"
        input_action: "DELETE /hr2/api/leave-applications/10/"
        expected_result: "Leave application deleted"
    alternate_paths:
      - scenario: "Delete pending leave without attachments"
        preconditions: "Leave approval_status is PENDING"
        input_action: "DELETE /hr2/api/leave-applications/10/"
        expected_result: "Leave application deleted"
    exception_paths:
      - scenario: "Delete non-pending leave"
        preconditions: "Leave approval_status is APPROVED"
        input_action: "DELETE /hr2/api/leave-applications/10/"
        expected_result: "Returns 400 with delete error"

  - id: "UC-HR2-017"
    title: "Approve or reject leave"
    description: "Approver updates leave status"
    actors: "HOD, Registrar, Director"
    preconditions: "Authenticated approver"
    happy_paths:
      - scenario: "Approve leave"
        preconditions: "Leave exists"
        input_action: "POST /hr2/api/leave-applications/10/approve/"
        expected_result: "Leave status updated to APPROVED"
      - scenario: "Forward leave"
        preconditions: "Leave exists"
        input_action: "POST /hr2/api/leave-applications/10/forward/"
        expected_result: "Leave status updated to FORWARDED"
    alternate_paths:
      - scenario: "Reject leave"
        preconditions: "Leave exists"
        input_action: "POST /hr2/api/leave-applications/10/reject/"
        expected_result: "Leave status updated to REJECTED"
    exception_paths:
      - scenario: "Invalid decision"
        preconditions: "Leave exists"
        input_action: "POST /hr2/api/leave-applications/10/invalid/"
        expected_result: "Returns 400 invalid decision"

  - id: "UC-HR2-018"
    title: "Nominee dashboard"
    description: "Nominee views pending substitution requests"
    actors: "Employee"
    preconditions: "Authenticated nominee"
    happy_paths:
      - scenario: "Nominee views pending requests"
        preconditions: "Nominee has pending requests"
        input_action: "GET /hr2/api/leave-nominee/"
        expected_result: "Returns pending nominee requests"
    alternate_paths:
      - scenario: "Nominee has no pending requests"
        preconditions: "Nominee has no pending requests"
        input_action: "GET /hr2/api/leave-nominee/"
        expected_result: "Returns empty list"
    exception_paths:
      - scenario: "Unauthorized user tries to view nominee dashboard"
        preconditions: "User is not authenticated"
        input_action: "GET /hr2/api/leave-nominee/"
        expected_result: "Returns 401 Unauthorized"

  - id: "UC-HR2-019"
    title: "Nominee decision"
    description: "Nominee accepts or declines substitution request"
    actors: "Employee"
    preconditions: "Authenticated nominee"
    happy_paths:
      - scenario: "Nominee accepts"
        preconditions: "Nominee is assigned on leave"
        input_action: "POST /hr2/api/leave-nominee/10/ with action=accept"
        expected_result: "Nominee status updated to ACCEPTED"
    alternate_paths:
      - scenario: "Nominee declines"
        preconditions: "Nominee is assigned on leave"
        input_action: "POST /hr2/api/leave-nominee/10/ with action=decline"
        expected_result: "Nominee status updated to DECLINED"
    exception_paths:
      - scenario: "Invalid action"
        preconditions: "Nominee is assigned"
        input_action: "POST /hr2/api/leave-nominee/10/ with action=invalid"
        expected_result: "Returns 400 invalid action"

  - id: "UC-HR2-020"
    title: "Request leave documents"
    description: "HOD requests supporting documents"
    actors: "HOD"
    preconditions: "Authenticated HOD"
    happy_paths:
      - scenario: "Request documents with message"
        preconditions: "Leave exists"
        input_action: "POST /hr2/api/leave-applications/10/request-document/ with message=submit proof"
        expected_result: "Document request status set to REQUESTED"
    alternate_paths:
      - scenario: "Request documents with updated message"
        preconditions: "Leave exists"
        input_action: "POST /hr2/api/leave-applications/10/request-document/ with message=submit updated proof"
        expected_result: "Document request status set to REQUESTED"
    exception_paths:
      - scenario: "Missing message"
        preconditions: "Leave exists"
        input_action: "POST /hr2/api/leave-applications/10/request-document/"
        expected_result: "Returns 400 message required"

  - id: "UC-HR2-021"
    title: "Submit leave documents"
    description: "Employee submits requested documents"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "Submit document after request"
        preconditions: "Document request exists"
        input_action: "POST /hr2/api/leave-applications/10/submit-document/ with submission=doc ref"
        expected_result: "Document request status set to SUBMITTED"
    alternate_paths:
      - scenario: "Submit updated document"
        preconditions: "Document request exists"
        input_action: "POST /hr2/api/leave-applications/10/submit-document/ with submission=updated ref"
        expected_result: "Document request status set to SUBMITTED"
    exception_paths:
      - scenario: "Submit without request"
        preconditions: "No document request exists"
        input_action: "POST /hr2/api/leave-applications/10/submit-document/ with submission=doc ref"
        expected_result: "Returns 400 no request"

  - id: "UC-HR2-022"
    title: "Cancellation decision"
    description: "Approver approves or rejects cancellation"
    actors: "HOD, Registrar, Director"
    preconditions: "Cancellation request exists"
    happy_paths:
      - scenario: "Approve cancellation"
        preconditions: "Approver role matches"
        input_action: "POST /hr2/api/leave-applications/10/cancel-decision/approve/"
        expected_result: "Cancellation approved and leave cancelled"
      - scenario: "Reject cancellation"
        preconditions: "Approver role matches"
        input_action: "POST /hr2/api/leave-applications/10/cancel-decision/reject/"
        expected_result: "Cancellation rejected"
    alternate_paths:
      - scenario: "Approve cancellation with remarks"
        preconditions: "Approver role matches"
        input_action: "POST /hr2/api/leave-applications/10/cancel-decision/approve/ with remarks=ok"
        expected_result: "Cancellation approved and leave cancelled"
    exception_paths:
      - scenario: "Invalid decision"
        preconditions: "Cancellation request exists"
        input_action: "POST /hr2/api/leave-applications/10/cancel-decision/invalid/"
        expected_result: "Returns 400 invalid decision"

  - id: "UC-HR2-023"
    title: "Extension decision"
    description: "Approver approves or rejects extension"
    actors: "HOD, Registrar, Director"
    preconditions: "Extension request exists"
    happy_paths:
      - scenario: "Approve extension"
        preconditions: "Approver role matches"
        input_action: "POST /hr2/api/leave-applications/10/extension-decision/approve/"
        expected_result: "Extension approved and leave updated"
      - scenario: "Reject extension"
        preconditions: "Approver role matches"
        input_action: "POST /hr2/api/leave-applications/10/extension-decision/reject/"
        expected_result: "Extension rejected"
    alternate_paths:
      - scenario: "Approve extension with remarks"
        preconditions: "Approver role matches"
        input_action: "POST /hr2/api/leave-applications/10/extension-decision/approve/ with remarks=ok"
        expected_result: "Extension approved and leave updated"
    exception_paths:
      - scenario: "Invalid decision"
        preconditions: "Extension request exists"
        input_action: "POST /hr2/api/leave-applications/10/extension-decision/invalid/"
        expected_result: "Returns 400 invalid decision"

  - id: "UC-HR2-024"
    title: "Record attendance"
    description: "Employee marks attendance"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "Mark attendance"
        preconditions: "Valid status and date"
        input_action: "POST /hr2/api/attendance/ with date=today, status=PRESENT"
        expected_result: "Attendance record created"
    alternate_paths:
      - scenario: "Mark half-day attendance"
        preconditions: "Valid status and date"
        input_action: "POST /hr2/api/attendance/ with date=today, status=HALF_DAY"
        expected_result: "Attendance record created"
    exception_paths:
      - scenario: "Missing attendance status"
        preconditions: "Employee is authenticated"
        input_action: "POST /hr2/api/attendance/ with date=today"
        expected_result: "Returns 400 validation errors"

  - id: "UC-HR2-025"
    title: "View attendance"
    description: "Employee views attendance history"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "View attendance for date range"
        preconditions: "Attendance exists"
        input_action: "GET /hr2/api/attendance/?from_date=2026-05-01&to_date=2026-05-10"
        expected_result: "Returns attendance records"
    alternate_paths:
      - scenario: "View attendance without filters"
        preconditions: "Attendance exists"
        input_action: "GET /hr2/api/attendance/"
        expected_result: "Returns attendance records"
    exception_paths:
      - scenario: "Unauthorized user tries to view attendance"
        preconditions: "User is not authenticated"
        input_action: "GET /hr2/api/attendance/"
        expected_result: "Returns 401 Unauthorized"

  - id: "UC-HR2-026"
    title: "List appraisal periods"
    description: "Fetch appraisal periods"
    actors: "Employee, HR staff"
    preconditions: "Authenticated user"
    happy_paths:
      - scenario: "List active periods"
        preconditions: "Periods exist"
        input_action: "GET /hr2/api/appraisal-periods/?is_active=true"
        expected_result: "Returns appraisal periods"
    alternate_paths:
      - scenario: "List all periods without filter"
        preconditions: "Periods exist"
        input_action: "GET /hr2/api/appraisal-periods/"
        expected_result: "Returns appraisal periods"
    exception_paths:
      - scenario: "Unauthorized user tries to view appraisal periods"
        preconditions: "User is not authenticated"
        input_action: "GET /hr2/api/appraisal-periods/"
        expected_result: "Returns 401 Unauthorized"

  - id: "UC-HR2-027"
    title: "Submit appraisal (performance)"
    description: "Employee submits performance appraisal"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "Submit appraisal"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/appraisals/ with period and scores"
        expected_result: "Performance appraisal created"
    alternate_paths:
      - scenario: "Submit appraisal with remarks"
        preconditions: "Required fields provided"
        input_action: "POST /hr2/api/appraisals/ with period, scores, remarks"
        expected_result: "Performance appraisal created"
    exception_paths:
      - scenario: "Missing required fields"
        preconditions: "Employee is authenticated"
        input_action: "POST /hr2/api/appraisals/ with incomplete payload"
        expected_result: "Returns 400 validation errors"

  - id: "UC-HR2-028"
    title: "List appraisals"
    description: "Employee views appraisals"
    actors: "Employee"
    preconditions: "Authenticated employee"
    happy_paths:
      - scenario: "List appraisals for period"
        preconditions: "Appraisals exist"
        input_action: "GET /hr2/api/appraisals/?period=1"
        expected_result: "Returns appraisals"
    alternate_paths:
      - scenario: "List all appraisals"
        preconditions: "Appraisals exist"
        input_action: "GET /hr2/api/appraisals/"
        expected_result: "Returns appraisals"
    exception_paths:
      - scenario: "Unauthorized user tries to list appraisals"
        preconditions: "User is not authenticated"
        input_action: "GET /hr2/api/appraisals/"
