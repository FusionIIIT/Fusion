  statement: A same-day urgent visit submitted inside the normal advance window requires Admin approval before it can proceed
    to the normal Host-approval path, unless another explicit approval bypass applies.
  applies_to: Pre-registration exception
  related_use_cases: VMS-UC-010, VMS-UC-035
  scenarios:
    valid:
      _test_id: BR203_V_01
      _br_id: BR203
      _scenario: Valid
      _expected_result: Route to Admin exception decision; do not silently waive the advance rule.
    invalid:
      _test_id: BR203_I_01
      _br_id: BR203
      _scenario: Invalid
      _expected_result: 'Violation of: A same-day urgent visit submitted inside the normal advance window requires Admin approval
        before it can proceed to the normal Host-approval path, unless another explicit approval bypass applies.'
