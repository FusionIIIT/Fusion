      _br_id: BR191
      _scenario: Invalid
      _expected_result: 'Violation of: VMS denies a zone-access attempt when the Visitor lacks permission for the target zone
        under the applicable policy/pass/override.'
- id: BR192
  source_id: VMS-BR-192
  name: Unauthorized Zone Access Logging
  rule_type: Audit / Trigger
  statement: Every unauthorized zone-access attempt is logged as a supported visit/zone-access event.
  applies_to: Zone access
