- id: BR193
  source_id: VMS-BR-193
  name: Maximum Visit Duration
  rule_type: Time / Constraint
  statement: A visit must not exceed the published policy-defined maximum duration; the frozen baseline default is 8 hours
    unless an approved extension applies.
  applies_to: Registration/pass validity
  related_use_cases: VMS-UC-005, VMS-UC-010, VMS-UC-034
  scenarios:
    valid:
      _test_id: BR193_V_01
      _br_id: BR193
      _scenario: Valid
      _expected_result: Reject/limit duration beyond the applicable maximum unless the extension rule is satisfied.
    invalid:
      _test_id: BR193_I_01
      _br_id: BR193
      _scenario: Invalid
      _expected_result: 'Violation of: A visit must not exceed the published policy-defined maximum duration; the frozen baseline
        default is 8 hours unless an approved extension applies.'
- id: BR194
  source_id: VMS-BR-194
  name: Extension Approval
  rule_type: Authorization
  statement: An extension beyond the policy-defined maximum visit duration requires Admin approval.
  applies_to: Visit extension
  related_use_cases: VMS-UC-034
  scenarios:
    valid:
      _test_id: BR194_V_01
      _br_id: BR194
      _scenario: Valid
      _expected_result: Do not activate the extension unless an authorized Admin approves it.
    invalid:
      _test_id: BR194_I_01
      _br_id: BR194
      _scenario: Invalid
      _expected_result: 'Violation of: An extension beyond the policy-defined maximum visit duration requires Admin approval.'
- id: BR195
  source_id: VMS-BR-195
  name: Pre-authorization Approval Bypass
  rule_type: Authorization / Routing
  statement: A valid applicable Host pre-authorization allows the visit to skip the individual Host-approval decision.
  applies_to: Pre-registered recurring visit
  related_use_cases: VMS-UC-010, VMS-UC-014
  scenarios:
