      _expected_result: 'Violation of: A valid applicable Host pre-authorization allows the visit to skip the individual Host-approval
        decision.'
- id: BR196
  source_id: VMS-BR-196
  name: VIP Override Authorization
  rule_type: Authorization
  statement: Only Super Admin grants the VMS VIP status/override permission represented by this module.
  applies_to: VIP handling
  related_use_cases: VMS-UC-003
  scenarios:
