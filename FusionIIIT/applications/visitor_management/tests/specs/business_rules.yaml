- id: BR190
  source_id: VMS-BR-190
  name: Pass Validity Window
  rule_type: Time / Eligibility
  statement: Gate entry is denied outside the pass valid-from and valid-until timestamps.
  applies_to: Gate validation
  related_use_cases: VMS-UC-018
  scenarios:
    valid:
