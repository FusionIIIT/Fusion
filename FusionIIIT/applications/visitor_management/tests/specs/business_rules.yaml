      _scenario: Invalid
      _expected_result: 'Violation of: Gate entry is denied outside the pass valid-from and valid-until timestamps.'
- id: BR191
  source_id: VMS-BR-191
  name: Unauthorized Zone Access Denial
  rule_type: Authorization / Constraint
  statement: VMS denies a zone-access attempt when the Visitor lacks permission for the target zone under the applicable policy/pass/override.
  applies_to: Zone access
  related_use_cases: VMS-UC-023
  scenarios:
