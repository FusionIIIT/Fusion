- id: BR197
  source_id: VMS-BR-197
  name: VIP Override Effect
  rule_type: Authorization / Exception
  statement: When a valid VIP override applies, the visit may bypass standard approval and zone restrictions only within the
    recorded override scope.
  applies_to: VIP visit
  related_use_cases: VMS-UC-003, VMS-UC-010, VMS-UC-018, VMS-UC-023
  scenarios:
    valid:
      _test_id: BR197_V_01
      _br_id: BR197
      _scenario: Valid
      _expected_result: Apply the bypass only to the explicitly authorized scope; otherwise use normal rules.
    invalid:
      _test_id: BR197_I_01
      _br_id: BR197
      _scenario: Invalid
      _expected_result: 'Violation of: When a valid VIP override applies, the visit may bypass standard approval and zone
        restrictions only within the recorded override scope.'
- id: BR200
  source_id: VMS-BR-200
  name: Expired Request State
  rule_type: Lifecycle
  statement: A pending visit request that reaches its approval timeout is marked Expired.
  applies_to: Host approval timeout
  related_use_cases: VMS-UC-011, VMS-UC-037
  scenarios:
    valid:
      _test_id: BR200_V_01
      _br_id: BR200
      _scenario: Valid
      _expected_result: Set Expired and prevent normal approval/pass activation unless a new supported process is initiated.
    invalid:
      _test_id: BR200_I_01
      _br_id: BR200
      _scenario: Invalid
      _expected_result: 'Violation of: A pending visit request that reaches its approval timeout is marked Expired.'
- id: BR202
  source_id: VMS-BR-202
  name: Advance Pre-registration Window
  rule_type: Time / Eligibility
  statement: Standard pre-registration is submitted at least 2 hours before the scheduled visit under the frozen baseline
    default.
  applies_to: Pre-registration
  related_use_cases: VMS-UC-010, VMS-UC-035
  scenarios:
    valid:
      _test_id: BR202_V_01
      _br_id: BR202
      _scenario: Valid
      _expected_result: If inside the normal window, require the supported same-day urgent Admin exception or reject/stop
        the normal path.
    invalid:
      _test_id: BR202_I_01
      _br_id: BR202
      _scenario: Invalid
      _expected_result: 'Violation of: Standard pre-registration is submitted at least 2 hours before the scheduled visit
        under the frozen baseline default.'
