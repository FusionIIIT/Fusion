workflows:
- id: BW01
  source_id: BW-VMS-01
  name: Pre-registered Approved Visit
  type: Basis
  purpose: Represent the normal approved pre-registration path through completed checkout.
  stt:
  - row: BW-VMS-01 R1
    from: Not Submitted
    actor: Visitor
    uc: VMS-UC-010
    guard: Valid standard submission; mandatory checks pass; no disqualifying blacklist match; normal advance window satisfied.
    to: Pending Host Approval
  - row: BW-VMS-01 R2
    from: Pending Host Approval
    actor: Host
    uc: VMS-UC-013
    guard: Outcome = Approve.
    to: Pass Active (PRE_REGISTERED)
  - row: BW-VMS-01 R3
    from: Pass Active (PRE_REGISTERED)
    actor: Security Personnel
    uc: VMS-UC-018
    guard: Pass active; within validity; no disqualifying blacklist match; gate/zone permission succeeds.
    to: On-site
  - row: BW-VMS-01 R4
    from: On-site
    actor: Security Personnel
    uc: VMS-UC-021
    guard: Checkout succeeds and exit is recorded.
    to: Completed
  scenarios:
    end_to_end:
      _test_id: BW01_E2E_01
      _wf_id: BW01
      _scenario: End-to-End
      _expected_result: 'Visit follows every STT row: Not Submitted -> Pending Host Approval -> Pass Active (PRE_REGISTERED)
        -> On-site -> Completed'
    negative:
      _test_id: BW01_NEG_01
      _wf_id: BW01
      _scenario: Negative
      _expected_result: A transition the STT does not allow is refused and state is unchanged.
