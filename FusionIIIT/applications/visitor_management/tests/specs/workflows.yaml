        Active -> Pass Active (PRE_REGISTERED) -> On-site -> Completed -> VIP Override Active -> Pass Active (VIP) -> On-site
        -> Completed -> Pending Admin Exception -> Pending Host Approval -> Pass Active (PRE_REGISTERED) -> On-site -> Completed'
    negative:
