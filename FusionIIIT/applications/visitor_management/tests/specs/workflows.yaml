    from: Not Submitted
    actor: Visitor
    uc: VMS-UC-010
    guard: Valid standard submission passes registration checks.
    to: Pending Host Approval
  - row: BW-VMS-02 R2
    from: Pending Host Approval
    actor: Host
    uc: VMS-UC-013
    guard: Outcome = Reject.
