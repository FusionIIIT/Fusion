  - row: BW-VMS-03 R1
    from: Not Submitted
    actor: Visitor
    uc: VMS-UC-010
    guard: Valid standard submission passes registration checks.
    to: Pending Host Approval
  - row: BW-VMS-03 R2
    from: Pending Host Approval
    actor: System
    uc: VMS-UC-037
    guard: Policy-defined approval timeout occurs while request remains pending.
    to: Expired
  - row: BW-VMS-04 R1
    from: No Active Pre-authorization
    actor: Host
    uc: VMS-UC-014
    guard: Valid scoped pre-authorization is created.
    to: Pre-authorization Active
