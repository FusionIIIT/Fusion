  - row: BW-VMS-04 R4
    from: On-site
    actor: Security Personnel
    uc: VMS-UC-021
    guard: Checkout succeeds.
    to: Completed
  - row: BW-VMS-05 R1
    from: Standard Visitor/Visit
    actor: Super Admin
    uc: VMS-UC-003
    guard: Super Admin grants a valid scoped VIP override.
    to: VIP Override Active
  - row: BW-VMS-05 R2
    from: VIP Override Active / Not Submitted
    actor: Visitor
    uc: VMS-UC-010
    guard: Registration checks pass and the active VIP override applies to the visit.
    to: Pass Active (VIP)
  - row: BW-VMS-05 R3
    from: Pass Active (VIP)
    actor: Security Personnel
    uc: VMS-UC-018
    guard: Gate validations not bypassed by the VIP override succeed.
    to: On-site
  - row: BW-VMS-05 R4
    from: On-site
    actor: Security Personnel
    uc: VMS-UC-021
    guard: Checkout succeeds.
    to: Completed
  - row: BW-VMS-22 R1
    from: Not Submitted
    actor: Visitor
    uc: VMS-UC-010
    guard: Other registration checks pass, but request violates normal advance window and is flagged urgent same-day.
    to: Pending Admin Exception
  - row: BW-VMS-22 R2
    from: Pending Admin Exception
    actor: Admin
    uc: VMS-UC-035
    guard: Outcome = Approve exception.
    to: Pending Host Approval
  - row: BW-VMS-22 R3
    from: Pending Host Approval
    actor: Host
    uc: VMS-UC-013
    guard: Outcome = Approve.
    to: Pass Active (PRE_REGISTERED)
  - row: BW-VMS-22 R4
    from: Pass Active (PRE_REGISTERED)
    actor: Security Personnel
    uc: VMS-UC-018
    guard: Gate validation succeeds.
    to: On-site
  - row: BW-VMS-22 R5
    from: On-site
    actor: Security Personnel
    uc: VMS-UC-021
    guard: Checkout succeeds.
    to: Completed
