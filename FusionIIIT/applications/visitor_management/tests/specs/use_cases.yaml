- id: UC013
  source_id: VMS-UC-013
  name: Decide Visit Request
  uc_type: Actor-triggered
  primary_actor: Host
  endpoint: /vms/api/host/requests/<ref>/decide/
  method: POST
  description: Approve or reject a pending visit request, with optional time/zone restrictions and special instructions.
  main_success_scenario:
  - Open the pending request.
  - Review visitor, purpose, schedule, and requested access.
  - Optionally set permitted/restricted zones, modify the allowed time window, and add special instructions.
  - Choose Approve or Reject.
  - VMS records the decision, updates request status, and notifies applicable Visitor/Security recipients.
  - For an approval requiring a pass, VMS makes the corresponding pass active/available according to pass rules.
  related_business_rules: VMS-BR-052
  related_workflows: BW-VMS-01, BW-VMS-02, BW-VMS-06, BW-VMS-08, BW-VMS-22, CW-VMS-01, CW-VMS-02
  scenarios:
    happy_path:
      _test_id: UC013_HP_01
      _uc_id: UC013
      _scenario: Happy Path
      _expected_result: Request is Approved or Rejected; approval restrictions/instructions are persisted.
    alternate_path:
      _test_id: UC013_AP_01
      _uc_id: UC013
      _scenario: Alternate Path
      _expected_result: Bulk approval may be used where explicitly supported for recurring vendors/scheduled events. If no
        Host decision occurs before the configured approval timeout, expiry is handled by event-triggered VMS-UC-037.
    exception_path:
      _test_id: UC013_EP_01
      _uc_id: UC013
      _scenario: Exception Path
      _expected_result: A decision on a non-pending/expired request is rejected.
