- id: UC018
  source_id: VMS-UC-018
  name: Validate Visitor Pass at Gate
  uc_type: Actor-triggered
  primary_actor: Security Personnel
  endpoint: /vms/api/security/gate/validate/
  method: POST
  description: Validate a Visitor credential at a gate checkpoint and allow or block entry according to current VMS rules.
  main_success_scenario:
  - Scan/enter the credential.
  - VMS validates pass active state, validity window, published blacklist/watchlist status, and gate/zone permission relevant
    to the checkpoint.
  - If all required validations succeed, allow VMS check-in and record the entry event.
  - If any validation fails, block entry and record the failure reason; create a flag/alert where required.
  related_business_rules: VMS-BR-052, VMS-BR-077, VMS-BR-082, VMS-BR-112, VMS-BR-116, VMS-BR-117, VMS-BR-120, VMS-BR-127,
    VMS-BR-190, VMS-BR-197
  related_workflows: BW-VMS-01, BW-VMS-04, BW-VMS-05, BW-VMS-06, BW-VMS-07, BW-VMS-09, BW-VMS-10, BW-VMS-21, BW-VMS-22, CW-VMS-01,
    CW-VMS-02, CW-VMS-03, CW-VMS-07
  scenarios:
    happy_path:
      _test_id: UC018_HP_01
      _uc_id: UC018
      _scenario: Happy Path
      _expected_result: Entry is either logged as allowed/on-site or blocked with reason.
    alternate_path:
      _test_id: UC018_AP_01
      _uc_id: UC018
      _scenario: Alternate Path
      _expected_result: For an override-eligible failure, Security Personnel may refer the blocked attempt to the Admin manual-override
        UC. Event fast-lane scanning uses the same validation obligations.
    exception_path:
      _test_id: UC018_EP_01
      _uc_id: UC018
      _scenario: Exception Path
      _expected_result: Unreadable/unknown credential or unavailable required validation source results in a blocked/exception
        outcome according to available online/offline handling.
