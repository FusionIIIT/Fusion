  uc_type: Event-triggered
  primary_actor: N.A. — Event-triggered
  endpoint: services.gate.reconcile_offline_events
  method: EVENT
  description: Synchronize/reconcile cached offline gate events when connectivity is restored.
  main_success_scenario:
  - Detect restoration of connectivity while cached gate events are pending reconciliation.
  - Synchronize the pending cached events with the authoritative VMS record.
  - Mark successfully synchronized events reconciled.
  - Flag any synchronization conflict for review instead of silently overwriting authoritative data.
  related_business_rules: N/A
  related_workflows: BW-VMS-11, CW-VMS-03
  scenarios:
    happy_path:
      _test_id: UC039_HP_01
      _uc_id: UC039
      _scenario: Happy Path
      _expected_result: Cached gate events are reconciled or explicitly flagged for review; no event is silently lost.
    alternate_path:
      _test_id: UC039_AP_01
      _uc_id: UC039
      _scenario: Alternate Path
      _expected_result: If no cached events are pending, no reconciliation action is required.
    exception_path:
      _test_id: UC039_EP_01
      _uc_id: UC039
      _scenario: Exception Path
      _expected_result: A data conflict is flagged for review rather than silently overwriting authoritative data.
- id: UC040
  source_id: VMS-UC-040
  name: Send Pending Approval Reminder
  uc_type: Event-triggered
  primary_actor: N.A. — Event-triggered
  endpoint: services.lifecycle.send_pending_reminders
  method: EVENT
  description: Send configured pending-approval reminders while a visit request remains undecided.
  main_success_scenario:
  - Detect a configured reminder instant for a visit request that is still pending.
  - Generate the pending-approval reminder for the responsible Host.
  - Route the reminder through the configured notification channel(s) and retain the notification event even if external delivery
    fails.
  related_business_rules: VMS-BR-174
  related_workflows: N/A
  scenarios:
    happy_path:
      _test_id: UC040_HP_01
      _uc_id: UC040
      _scenario: Happy Path
      _expected_result: The reminder event is recorded and routed to the Host through the configured channel(s).
    alternate_path:
      _test_id: UC040_AP_01
      _uc_id: UC040
      _scenario: Alternate Path
      _expected_result: If the request is no longer pending, the reminder is suppressed. Multiple configured reminder instants
        may be supported.
    exception_path:
      _test_id: UC040_EP_01
      _uc_id: UC040
      _scenario: Exception Path
      _expected_result: If a delivery channel is unavailable, preserve the notification event and apply the configured-channel
        behavior without inventing delivery guarantees.
