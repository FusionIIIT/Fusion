      _uc_id: UC017
      _scenario: Happy Path
      _expected_result: A valid walk-in case reaches the appropriate approval state; no approval is embedded as an action
        of Security Personnel.
    alternate_path:
      _test_id: UC017_AP_01
      _uc_id: UC017
      _scenario: Alternate Path
