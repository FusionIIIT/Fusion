- id: UC010
  source_id: VMS-UC-010
  name: Pre-register Visit
  uc_type: Actor-triggered
  primary_actor: Visitor
  endpoint: /vms/api/public/visits/
  method: POST
  description: Submit an online visit request with required visitor, purpose, host, schedule, and ID-document information.
  main_success_scenario:
  - Enter visitor personal/contact information.
  - Enter visit purpose and schedule.
  - Select the Host.
  - Provide the required ID-document information.
  - Submit the request.
  - VMS validates mandatory fields, duplicate request conditions, applicable blacklist/watchlist checks, visit-duration/advance-registration
    constraints, and any supported exception path.
  - For a valid standard request, VMS creates a pending request and notifies the selected Host.
  related_business_rules: VMS-BR-037, VMS-BR-038, VMS-BR-051, VMS-BR-052, VMS-BR-112, VMS-BR-117, VMS-BR-120, VMS-BR-127,
