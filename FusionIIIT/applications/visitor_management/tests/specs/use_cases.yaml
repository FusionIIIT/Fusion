use_cases:
- id: UC001
  source_id: VMS-UC-001
  name: Configure VMS Roles
  uc_type: Actor-triggered
  primary_actor: Super Admin
  endpoint: /vms/api/superadmin/roles/
  method: GET, POST
  description: Assign or reassign Admin and Security Personnel roles for a defined gate/zone/campus scope and duration.
  main_success_scenario:
  - Select the user and VMS role.
  - Specify gate/zone/campus scope and duration.
  - Submit the assignment or reassignment.
  - VMS validates hierarchy and scope, records the active assignment, and audits the change.
  - For reassignment, VMS makes the new assignment effective and routes applicable pending work to the newly assigned personnel.
  related_business_rules: VMS-BR-181, VMS-BR-182, VMS-BR-183, VMS-BR-184
  related_workflows: N/A
  scenarios:
    happy_path:
      _test_id: UC001_HP_01
      _uc_id: UC001
      _scenario: Happy Path
      _expected_result: The authorized role assignment is active and auditable.
    alternate_path:
      _test_id: UC001_AP_01
      _uc_id: UC001
      _scenario: Alternate Path
      _expected_result: If the requested role/scope conflicts with VMS role hierarchy or assignment constraints, VMS rejects
        the change.
    exception_path:
      _test_id: UC001_EP_01
      _uc_id: UC001
      _scenario: Exception Path
      _expected_result: If the directory user cannot be resolved, VMS does not create the role assignment.
