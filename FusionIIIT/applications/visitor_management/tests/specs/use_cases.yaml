  uc_type: Actor-triggered
  primary_actor: Security Personnel
  endpoint: /vms/api/security/walk-ins/
  method: POST
  description: Capture and submit a walk-in visitor registration at a gate checkpoint.
  main_success_scenario:
  - Capture visitor personal/contact details.
  - Scan/enter required ID-document information.
  - Capture visit purpose/schedule as applicable and select the Host.
  - Submit the walk-in registration.
  - VMS validates required data and applicable blacklist/watchlist conditions.
