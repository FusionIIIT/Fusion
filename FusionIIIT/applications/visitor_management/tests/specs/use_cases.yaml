  related_workflows: BW-VMS-01, BW-VMS-02, BW-VMS-03, BW-VMS-04, BW-VMS-05, BW-VMS-22, CW-VMS-01
  scenarios:
    happy_path:
      _test_id: UC010_HP_01
      _uc_id: UC010
      _scenario: Happy Path
      _expected_result: A valid request is created in the correct pending/authorized state and the next responsible actor
        is notified.
    alternate_path:
      _test_id: UC010_AP_01
      _uc_id: UC010
      _scenario: Alternate Path
      _expected_result: If a valid pre-authorization or VIP override applies, the individual Host-approval step may be bypassed
        according to the applicable rule. A same-day urgent request that violates the normal advance window is routed to the
        Admin exception decision rather than silently accepted.
    exception_path:
      _test_id: UC010_EP_01
      _uc_id: UC010
      _scenario: Exception Path
      _expected_result: Invalid mandatory data, an active disqualifying blacklist match, or other failed validation prevents
        request acceptance; the reason is recorded/displayed as applicable.
